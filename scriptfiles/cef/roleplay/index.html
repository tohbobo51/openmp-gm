<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vice Side Roleplay - CEF HUD</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        /* Top-Right Player Stats & Server Banner */
        .hud-top-right {
            position: absolute;
            top: 24px;
            right: 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        .server-badge {
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 187, 0, 0.3);
            border-radius: 8px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .server-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffbb00;
            text-transform: uppercase;
        }

        .server-ip {
            font-size: 11px;
            color: #8e8e93;
            font-family: monospace;
        }

        .stats-panel {
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .money-counter {
            font-size: 18px;
            font-weight: 800;
            color: #34c759;
            font-family: monospace;
            text-align: right;
            text-shadow: 0 0 10px rgba(52, 199, 89, 0.4);
        }

        .bar-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #8e8e93;
            font-weight: 600;
            text-transform: uppercase;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .health-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff3b30, #ff453a);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .armour-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0a84ff, #5ac8fa);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* Bottom-Right Speedometer (Hidden by default, shown when inside vehicle) */
        .speedometer {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 187, 0, 0.3);
            border-radius: 14px;
            padding: 16px 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 160px;
        }

        .speed-value {
            font-size: 36px;
            font-weight: 900;
            font-family: monospace;
            color: #ffbb00;
            line-height: 1;
        }

        .speed-unit {
            font-size: 11px;
            font-weight: 700;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <!-- Top-right HUD -->
    <div class="hud-top-right">
        <div class="server-badge">
            <div>
                <div class="server-title">Vice Side Roleplay</div>
                <div class="server-ip">142.132.203.47:10125</div>
            </div>
        </div>

        <div class="stats-panel">
            <div class="money-counter" id="hud-money">$500</div>
            
            <div class="bar-container">
                <div class="bar-label">
                    <span>Health</span>
                    <span id="health-val">100%</span>
                </div>
                <div class="progress-bar">
                    <div class="health-fill" id="hud-health"></div>
                </div>
            </div>

            <div class="bar-container">
                <div class="bar-label">
                    <span>Armour</span>
                    <span id="armour-val">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="armour-fill" id="hud-armour"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom-right Speedometer -->
    <div class="speedometer" id="speedo-box">
        <div class="speed-value" id="speed-val">0</div>
        <div class="speed-unit">KM / H</div>
    </div>

    <script>
        // Listen for CEF events emitted from Pawn
        if (window.cef) {
            cef.on("updateStats", function(money, health, armour) {
                document.getElementById("hud-money").innerText = "$" + Number(money).toLocaleString();
                document.getElementById("hud-health").style.width = health + "%";
                document.getElementById("health-val").innerText = Math.round(health) + "%";
                document.getElementById("hud-armour").style.width = armour + "%";
                document.getElementById("armour-val").innerText = Math.round(armour) + "%";
            });

            cef.on("updateSpeed", function(speed, inVehicle) {
                const box = document.getElementById("speedo-box");
                if (inVehicle) {
                    box.style.display = "flex";
                    document.getElementById("speed-val").innerText = Math.round(speed);
                } else {
                    box.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
